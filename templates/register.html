{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

  <div class="col-md-5 bg-white p-4 rounded shadow">

    <h3 class="mb-3">Welcome — Register to Continue</h3>

    <form method="POST">

      {% csrf_token %}

      <input type="text"
             name="name"
             class="form-control mb-3"
             placeholder="Full Name"
             required>

      <input type="text"
             name="phone"
             class="form-control mb-3"
             placeholder="Phone Number"
             required>

      <input type="email"
             name="email"
             class="form-control mb-3"
             placeholder="Email Address"
             required>

      <!-- ADD PASSWORD HERE -->
      <div class="password-box">
    <input type="password"
           name="password"
           id="registerPassword"
           autocomplete="current-password"
           class="form-control"
           required>

    <button type="button"
            class="password-toggle"
            onclick="togglePassword('registerPassword', this)">
        👁
    </button>
</div>
 <!-- REGISTER BUTTON -->
    <button type="submit" class="register-btn">
        Register
    </button>

    </form>

  </div>

</div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.innerHTML = "🙈";
    } else {
        input.type = "password";
        button.innerHTML = "👁";
    }
}
</script>

{% endblock %}
