{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width: 500px; margin: 60px auto;">

    <h1 class="text-center mb-4">Login to BookPlaza</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Enter your phone number"
                   required>
        </div>

       <div class="password-box">
        <label class="form-label">Password</label>
    <input type="password"
           name="password"
           id="loginPassword"
           class="form-control"
           required>

    <button type="button"
            class="password-toggle"
            onclick="togglePassword('loginPassword', this)">
        👁
    </button>
</div>
<!-- LOGIN BUTTON -->
    <button type="submit" class="login-btn">
        Login
    </button>
    </form>

    <p class="text-center mt-3">
        Don't have an account?
        <a href="{% url 'register' %}?next={{ request.GET.next|urlencode }}">Register here</a>
    </p>

</div>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        button.innerHTML = "🙈";
    } else {
        input.type = "password";
        button.innerHTML = "👁";
    }
}
</script>

{% endblock %}
