{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Plaza{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f5ead6;
            --terracotta: #c17a4f;
            --brown: #4a3628;
            --gold: #d4a76a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Lora', serif;
            color: var(--brown);
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf6e8 0%, #f8eed8 50%, #f2e4c8 100%);
            overflow-x: hidden;
        }
        #bg-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .navbar, main { position: relative; z-index: 10; }
        h1, h2, h3, .navbar-brand {
            font-family: 'Playfair Display', serif;
        }
        .navbar {
            background-color: var(--brown) !important;
        }
        .navbar-brand {
            color: var(--gold) !important;
            font-size: 1.6rem;
        }
        .btn-warm {
            background-color: var(--terracotta);
            color: #fff;
            border: none;
        }
        .btn-warm:hover {
            background-color: var(--brown);
            color: var(--gold);
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
       <nav>
         <a href="{% url 'home' %}">Home</a>
         <a href="{% url 'categories' %}">Categories</a>
         <a href="{% url 'view_cart' %}">Cart</a>
         <a href="{% url 'your_orders' %}">Your Orders</a>
         <a href="{% url 'about_us' %}">About Us</a>
         <div class="user-menu">
    <button class="three-dot-btn" onclick="toggleUserMenu()">
        ⋮
    </button>

    <div class="user-dropdown" id="userDropdown">

        {% if user.is_authenticated %}

            <a href="{% url 'logout' %}">Logout</a>

        {% else %}

            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}">Register</a>

        {% endif %}

    </div>
</div>
        </nav>
    
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const emojis = ['📚','📖','📝','✏️','🔖','📓','📕','📗','📘','🖊️','📐','📏','🎓','🔍','💡'];

        const particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                emoji: emojis[Math.floor(Math.random() * emojis.length)],
                size: Math.random() * 20 + 16,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.5,
                opacity: Math.random() * 0.5 + 0.55,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.01,
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.rotation += p.rotSpeed;

                if (p.x < -50) p.x = canvas.width + 50;
                if (p.x > canvas.width + 50) p.x = -50;
                if (p.y < -50) p.y = canvas.height + 50;
                if (p.y > canvas.height + 50) p.y = -50;

                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.font = `${p.size}px serif`;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillText(p.emoji, -p.size/2, p.size/2);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Mouse interaction - emojis gently avoid cursor
        document.addEventListener('mousemove', (e) => {
            particles.forEach(p => {
                const dx = e.clientX - p.x;
                const dy = e.clientY - p.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 120) {
                    p.speedX -= dx / dist * 0.3;
                    p.speedY -= dy / dist * 0.3;
                    p.speedX = Math.max(-1.5, Math.min(1.5, p.speedX));
                    p.speedY = Math.max(-1.5, Math.min(1.5, p.speedY));
                }
            });
        });
    </script>
    <script>
function toggleUserMenu() {
    const menu = document.getElementById("userDropdown");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
</script>
</body>
</html>
