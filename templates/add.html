{% extends 'base.html' %}

{% block title %}Add New Book - Book Plaza{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-md-6 col-sm-10">
        <div class="card shadow-sm p-4 bg-white rounded">
            <h2 class="h4 text-success mb-4">Add Book Details</h2>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">Book Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g., The Alchemist" required>
                </div>

                <div class="mb-3">
                    <label for="author" class="form-label fw-bold">Author Name</label>
                    <input type="text" class="form-control" id="author" name="author" placeholder="e.g., Paulo Coelho" required>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label fw-bold">Price ($)</label>
                    <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="12.99" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-success px-4">Save Book</button>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label fw-bold">Category</label>
                    <select class="form-control" id="category" name="category" required>
                        <option value="fiction">Fiction</option>
                        <option value="non_fiction">Non-Fiction</option>
                        <option value="science">Science</option>
                        <option value="history">History</option>
                        <option value="self_help">Self Help</option>
                        <option value="biography">Biography</option>
                        <option value="children">Children</option>
                        <option value="technology">Technology</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="image" class="form-label fw-bold">Book Cover Image</label>
                    <input type="file" class="form-control" id="image" name="image" accept="image/*" required>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
